# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "780623701173e04f1ed178424bd72ba9"
name = "GabbarInfo AI"
application_url = "https://ai.gabbarinfo.com"
embedded = false

[access_scopes]
scopes = "read_content,write_content,read_products,write_products"

[auth]
redirect_urls = [
  "https://ai.gabbarinfo.com/api/shopify/callback"
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/data_request"
  ]
  uri = "https://ai.gabbarinfo.com/api/shopify/webhooks/customers-data-request"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "customers/redact"
  ]
  uri = "https://ai.gabbarinfo.com/api/shopify/webhooks/customers-redact"

  [[webhooks.subscriptions]]
  compliance_topics = [
    "shop/redact"
  ]
  uri = "https://ai.gabbarinfo.com/api/shopify/webhooks/shop-redact"
